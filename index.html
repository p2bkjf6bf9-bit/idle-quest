<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>はるかなる遠征 — 放置RPG</title>
<style>
:root{
  --bg:#0d1017; --panel:#161b26; --panel2:#1d2331; --line:#2c3447;
  --ink:#e6eaf4; --dim:#8c96ad; --gold:#e9c46a; --green:#6ee7a8;
  --red:#ff7b7b; --blue:#7cc4ff; --purple:#b79cff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI","Yu Gothic UI","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 64px;}

/* ---- header ---- */
header{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 16px;margin-bottom:16px;
  background:linear-gradient(180deg,#1a2030,#141924);
  border:1px solid var(--line);border-radius:14px;
}
header h1{margin:0;font-size:17px;letter-spacing:.06em;font-weight:700;}
header h1 small{display:block;font-size:10px;letter-spacing:.24em;color:var(--dim);font-weight:400;margin-top:2px;}
.who{margin-left:auto;text-align:right;font-size:11px;color:var(--dim);}
.who b{color:var(--ink);font-size:13px;}
.who code{font-size:10px;color:#636d85;}
.tools{display:flex;gap:6px;flex-wrap:wrap;}

/* ---- common ---- */
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:14px;
}
.panel h2{
  margin:0 0 12px;font-size:12px;letter-spacing:.18em;color:var(--gold);
  font-weight:700;display:flex;align-items:center;gap:8px;
}
.panel h2 .n{
  width:18px;height:18px;border-radius:5px;background:rgba(233,196,106,.16);
  display:grid;place-items:center;font-size:10px;color:var(--gold);
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:760px){.grid2{grid-template-columns:1fr;}}

button{
  font:inherit;cursor:pointer;border-radius:9px;
  border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  padding:7px 13px;font-size:12px;transition:.15s;
}
button:hover:not(:disabled){background:#293146;border-color:#3d4761;}
button:disabled{opacity:.4;cursor:not-allowed;}
button.primary{
  background:linear-gradient(100deg,#e9c46a,#f4a261);color:#1a1205;
  border:0;font-weight:700;padding:11px 26px;font-size:14px;letter-spacing:.06em;
}
button.primary:hover:not(:disabled){filter:brightness(1.1);}
button.ghost{background:transparent;}
button.danger{color:var(--red);border-color:#4a2b32;}
button.danger:hover:not(:disabled){background:#2a1a1e;}

.bar{height:9px;border-radius:99px;background:#0a0d14;overflow:hidden;border:1px solid #232a3a;}
.bar > i{display:block;height:100%;border-radius:99px;transition:width .3s;}
.bar.hp > i{background:linear-gradient(90deg,#4ade80,#86efac);}
.bar.hp.low > i{background:linear-gradient(90deg,#ef4444,#fca5a5);}
.bar.exp > i{background:linear-gradient(90deg,#7cc4ff,#b79cff);}
.bar.time > i{background:linear-gradient(90deg,#e9c46a,#f4a261);}

.kv{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin:4px 0 2px;}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums;}

/* ---- stats ---- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:center;}
.stat span{display:block;font-size:10px;letter-spacing:.14em;color:var(--dim);}
.stat b{display:block;font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums;}
.mul{color:var(--gold);font-size:11px;margin-top:8px;text-align:center;min-height:17px;}

/* ---- equip slots ---- */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media(max-width:560px){.slots{grid-template-columns:repeat(2,1fr);}}
.slot{
  background:var(--panel2);border:1px dashed #333c52;border-radius:11px;
  padding:10px;text-align:center;min-height:92px;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
}
.slot.filled{border-style:solid;border-color:#3b465f;background:#1f2636;}
.slot .lab{font-size:9.5px;letter-spacing:.16em;color:var(--dim);}
.slot .ic{font-size:21px;line-height:1.1;}
.slot .nm{font-size:11.5px;font-weight:600;}
.slot .vl{font-size:10.5px;color:var(--green);font-variant-numeric:tabular-nums;}
.slot .empty{font-size:11px;color:#525c74;}

.ser{display:inline-block;font-size:9px;padding:1px 6px;border-radius:99px;margin-top:3px;}
.ser.iron{background:rgba(160,174,200,.18);color:#b8c4dc;}
.ser.silver{background:rgba(190,215,255,.16);color:#cfe2ff;}
.ser.dragon{background:rgba(183,156,255,.18);color:var(--purple);}
.ser.cook{background:rgba(255,183,120,.18);color:#ffc89a;}
.ser.none{background:rgba(120,130,150,.14);color:#8b95ab;}
.gold{color:var(--gold);font-variant-numeric:tabular-nums;}
.bdg{font-size:9px;padding:1px 6px;border-radius:99px;margin-left:5px;white-space:nowrap;}
.bdg.eq{background:rgba(110,231,168,.18);color:var(--green);}
.bdg.dup{background:rgba(255,183,120,.18);color:#ffc89a;}
.slot.pick{cursor:pointer;}
.slot.pick:hover{border-color:var(--gold);background:#272436;}
.slot .tap{font-size:9px;color:#5d6591;letter-spacing:.1em;margin-top:3px;}
.item.isEq{border-color:#2f6b50;background:#17251f;}
.item.isLocked{border-color:#5a4a2a;}
.bdg.lock{background:rgba(233,196,106,.2);}
.lockbtn{padding:4px 8px;font-size:12px;line-height:1;filter:grayscale(1) opacity(.6);}
.lockbtn.on{filter:none;border-color:var(--gold);background:#2a2415;}
/* 同じ系統がそろった装備枠 */
.slot.syn{background:#241f33;}
.slot.syn.s-iron  {border-color:#8e9cc0;box-shadow:0 0 0 1px rgba(142,156,192,.35),0 0 18px rgba(142,156,192,.18);}
.slot.syn.s-silver{border-color:#9fc4ff;box-shadow:0 0 0 1px rgba(159,196,255,.4),0 0 18px rgba(159,196,255,.2);}
.slot.syn.s-dragon{border-color:#b79cff;box-shadow:0 0 0 1px rgba(183,156,255,.45),0 0 20px rgba(183,156,255,.25);}
.slot.syn.s-cook  {border-color:#ffb778;box-shadow:0 0 0 1px rgba(255,183,120,.45),0 0 20px rgba(255,183,120,.25);}
.synbdg{
  display:inline-block;margin-left:5px;padding:1px 7px;border-radius:99px;
  font-size:10px;font-weight:700;letter-spacing:.02em;
  background:rgba(255,255,255,.14);color:#fff;
}
.synmul{font-weight:700;letter-spacing:.04em;}
/* 帰還画面の戦利品 */
.loot{
  margin:14px 0 4px;padding:12px;border-radius:12px;
  background:rgba(233,196,106,.06);border:1px solid rgba(233,196,106,.25);
}
.loot.none{background:rgba(255,255,255,.03);border-color:var(--line);}
.loot h5{
  margin:0 0 9px;font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:700;
}
.loot.none h5{color:var(--dim);}
.loot .item{background:#1b2231;}
.loot .item .vl{color:var(--blue);}
.loot .tagx{font-size:9px;padding:1px 6px;border-radius:99px;margin-left:5px;
  background:rgba(255,255,255,.1);color:var(--dim);}
.loot .empty-msg{padding:4px 0;}
.synmul.s-iron{color:#b8c4dc;} .synmul.s-silver{color:#cfe2ff;}
.synmul.s-dragon{color:var(--purple);} .synmul.s-cook{color:#ffc89a;}
.stage.locked{opacity:.78;border-style:dashed;}
.stage.locked:hover{opacity:1;border-color:var(--gold);}
.price{font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums;}
.shopdesc{font-size:10.5px;color:var(--dim);display:block;font-weight:400;}

/* ---- inventory ---- */
.invtabs{display:flex;gap:6px;margin-bottom:10px;}
.invtabs button{white-space:nowrap;flex:1;padding:7px 6px;}
@media(max-width:460px){.invtabs button{font-size:10.5px;padding:7px 3px;letter-spacing:-.02em;}}
.invtabs button.on{background:#303a52;border-color:#47536f;color:#fff;}
.invlist{display:flex;flex-direction:column;gap:6px;min-height:40px;}
.item{
  display:flex;align-items:center;gap:10px;
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;
}
.item.on{border-color:var(--gold);background:#272436;}
.item .ic{font-size:17px;}
.item .nm{font-size:12px;font-weight:600;flex:1;}
.item .vl{font-size:11px;color:var(--green);font-variant-numeric:tabular-nums;}
.item .btns{display:flex;gap:5px;}
.item button{padding:4px 9px;font-size:10.5px;}
.empty-msg{color:#525c74;font-size:11.5px;text-align:center;padding:12px 0;}

/* ---- stages ---- */
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:760px){.stages{grid-template-columns:1fr;}}
.stage{
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:13px;cursor:pointer;transition:.15s;text-align:left;
}
.stage:hover{border-color:#4a5572;background:#232b3d;}
.stage.on{border-color:var(--gold);background:#272436;box-shadow:0 0 0 1px rgba(233,196,106,.3);}
.stage .top{display:flex;align-items:center;gap:8px;}
.stage .ic{font-size:22px;}
.stage .nm{font-weight:700;font-size:13.5px;}
.stage .lv{font-size:9.5px;letter-spacing:.14em;color:var(--dim);}
.stage .desc{font-size:11px;color:var(--dim);margin-top:7px;line-height:1.55;}
.stage .meta{display:flex;gap:10px;margin-top:8px;font-size:10.5px;color:var(--blue);}

/* ---- adventure ---- */
.advhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.advhead .ic{font-size:30px;}
.advhead .nm{font-size:16px;font-weight:700;}
.advhead .sub{font-size:11px;color:var(--dim);}
.advhead .clock{
  margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;
}
.advhead .clock b{font-size:22px;}
.advhead .clock span{display:block;font-size:10px;letter-spacing:.14em;color:var(--dim);}

.enemy{
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;margin:12px 0;display:flex;align-items:center;gap:12px;min-height:62px;
}
.enemy .ic{font-size:26px;}
.enemy .nm{font-weight:700;font-size:13.5px;}
.enemy .tag{font-size:9.5px;padding:1px 7px;border-radius:99px;margin-left:6px;}
.tag.boss{background:rgba(255,123,123,.18);color:var(--red);}
.tag.big{background:rgba(183,156,255,.2);color:var(--purple);}
.tag.var{background:rgba(233,196,106,.18);color:var(--gold);}
.enemy .side{flex:1;}
.enemy.idle{color:var(--dim);font-size:12px;justify-content:center;}

#log{
  background:#080b11;border:1px solid var(--line);border-radius:11px;
  height:330px;overflow-y:auto;padding:12px 14px;
  font-family:"Consolas","SFMono-Regular","Yu Gothic UI",monospace;
  font-size:12.2px;line-height:1.85;
}
#log .l{display:flex;gap:9px;}
#log .t{color:#515c76;flex:none;font-variant-numeric:tabular-nums;}
#log .m{flex:1;word-break:break-word;}
#log .dmg{color:var(--gold);}
#log .hurt{color:var(--red);}
#log .kill{color:var(--green);}
#log .get{color:var(--blue);}
#log .lvup{color:var(--purple);font-weight:700;}
#log .boss{color:var(--red);font-weight:700;}
#log .fairy{color:#ffc0e8;font-weight:700;}
#log .sys{color:var(--dim);}

/* ---- modal ---- */
.modal{
  position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;
  background:rgba(4,6,11,.78);backdrop-filter:blur(3px);
}
.modal.hide{display:none;}
.modal .box{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:22px;max-width:520px;width:100%;max-height:84vh;overflow-y:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.modal h3{margin:0 0 10px;font-size:17px;}
.modal p{margin:0 0 14px;font-size:13px;color:#c3cbdd;}
.modal .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0;}
.res div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;}
.res span{font-size:10px;letter-spacing:.13em;color:var(--dim);display:block;}
.res b{font-size:17px;font-variant-numeric:tabular-nums;}

.note{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.7;}
textarea{
  font-family:"Consolas","SFMono-Regular",monospace;font-size:11px;line-height:1.5;
  background:#0b0e15;color:#b9c0e6;border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;width:100%;height:150px;resize:vertical;
}
input[type=text]{
  font:inherit;font-size:13px;background:#0b0e15;color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:7px 11px;width:100%;
}
.speed{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);}
.speed button{padding:3px 8px;font-size:10.5px;}
.speed button.on{background:#303a52;border-color:#47536f;color:var(--gold);}
.hide{display:none!important;}

/* ---------- チュートリアル ---------- */
#coach{position:fixed;inset:0;z-index:38;pointer-events:none;transition:opacity .2s;}
/* 別の画面が開いている間は、当たり判定ごと消す（クリックを奪わせない） */
#coach.away{opacity:0;visibility:hidden;}
#coachBlock{position:fixed;inset:0;pointer-events:auto;}
#coach.pass #coachBlock{pointer-events:none;}
#coachHole{
  position:fixed;border-radius:16px;pointer-events:none;
  border:2px solid var(--gold);
  box-shadow:0 0 0 9999px rgba(4,6,12,.76), 0 0 24px rgba(233,196,106,.35);
  transition:left .28s,top .28s,width .28s,height .28s;
}
#coachBubble{
  position:fixed;width:min(360px,calc(100vw - 28px));pointer-events:auto;
  background:var(--panel);border:1px solid #3c4766;border-radius:14px;
  padding:16px 18px 13px;box-shadow:0 20px 56px rgba(0,0,0,.65);
}
#coachBubble h4{margin:0 0 8px;font-size:14.5px;color:var(--gold);letter-spacing:.04em;}
#coachBubble p{margin:0;font-size:13px;line-height:1.85;color:#c6cdea;}
#coachBubble .do{
  margin-top:11px;padding:9px 11px;border-radius:9px;font-size:12.5px;
  background:rgba(233,196,106,.12);border:1px solid rgba(233,196,106,.35);color:var(--gold);
}
#coachBubble .foot{display:flex;align-items:center;gap:8px;margin-top:13px;}
#coachBubble .foot .sp{margin-left:auto;}
.coach-skip{
  background:none;border:0;padding:0;cursor:pointer;
  font-size:9.5px;color:#49506b;text-decoration:underline;letter-spacing:.02em;
}
.coach-skip:hover{color:#8c96ad;}
#coachBubble .count{font-size:10px;color:#49506b;letter-spacing:.1em;}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>はるかなる遠征<small>IDLE QUEST — 放置RPG</small></h1>
  </div>
  <div class="who">
    <b id="pname">冒険者</b>　<b class="gold" id="pgold">0 G</b><br>
    <code id="pid">—</code>
  </div>
  <div class="tools">
    <button id="btnName" class="ghost">名前</button>
    <button id="btnExport" class="ghost">セーブ書き出し</button>
    <button id="btnImport" class="ghost">読み込み</button>
    <button id="btnReset" class="ghost danger">初期化</button>
  </div>
</header>

<!-- ============ 準備画面 ============ -->
<div id="scPrep">
  <div class="grid2">
    <div class="panel" id="panelHero">
      <h2><span class="n">1</span>冒険者</h2>
      <div class="kv"><span>LEVEL <b id="plv">1</b></span><span>HP <b id="php">60 / 60</b></span></div>
      <div class="bar hp"><i id="phpbar" style="width:100%"></i></div>
      <div class="kv" style="margin-top:10px;"><span>EXP</span><span><b id="pexp">0</b> / <b id="pexpn">18</b></span></div>
      <div class="bar exp"><i id="pexpbar" style="width:0%"></i></div>
      <div class="stats">
        <div class="stat"><span>こうげき</span><b id="patk">9</b></div>
        <div class="stat"><span>ぼうぎょ</span><b id="pdef">0</b></div>
        <div class="stat"><span>しょじきん</span><b class="gold" id="pgold2">0</b></div>
      </div>
      <div class="mul" id="pmul"></div>
    </div>

    <div class="panel" id="panelGear">
      <h2><span class="n">2</span>そうび</h2>
      <div class="slots" id="slots"></div>
      <div class="note">装備が欠けていても出発できます。</div>
    </div>
  </div>

  <div class="panel" id="panelInv">
    <h2><span class="n">3</span>もちもの<span style="color:var(--dim);font-weight:400;letter-spacing:0;font-size:11px;">（各5個まで・あふれたら売る）</span></h2>
    <div class="invtabs" id="invtabs">
      <button data-k="w" class="on">⚔️ 武器 <span id="cw"></span></button>
      <button data-k="s">🛡️ 盾 <span id="cs"></span></button>
      <button data-k="a">🥋 防具 <span id="ca"></span></button>
      <button data-k="i">🧪 アイテム <span id="ci"></span></button>
    </div>
    <div class="invlist" id="invlist"></div>
  </div>

  <div class="panel" id="panelShop">
    <h2><span class="n">4</span>よろず屋<span style="color:var(--dim);font-weight:400;letter-spacing:0;font-size:11px;">（いらない装備を売ったお金で買えます）</span></h2>
    <div class="invlist" id="shoplist"></div>
  </div>

  <div class="panel" id="panelStage">
    <h2><span class="n">5</span>ステージをえらぶ</h2>
    <div class="stages" id="stages"></div>
    <div style="display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap;">
      <button class="primary" id="btnGo" disabled>出発する</button>
</div>
  </div>
</div>

<!-- ============ 冒険画面 ============ -->
<div id="scAdv" class="hide">
  <div class="panel">
    <div class="advhead">
      <div class="ic" id="aIc">🌿</div>
      <div>
        <div class="nm" id="aNm">—</div>
        <div class="sub" id="aSub">—</div>
      </div>
      <div class="clock">
        <b id="aElapsed">0:00</b>
        <span>けいか / <span id="aTotal">5:00</span></span>
      </div>
    </div>
    <div class="bar time"><i id="aTimebar" style="width:0%"></i></div>

    <div class="grid2" style="margin-top:14px;">
      <div>
        <div class="kv"><span>じぶん</span><span>HP <b id="aHp">60 / 60</b></span></div>
        <div class="bar hp"><i id="aHpbar" style="width:100%"></i></div>
        <div class="kv" style="margin-top:9px;"><span>LEVEL <b id="aLv">1</b></span><span>EXP <b id="aExp">0</b></span></div>
        <div class="bar exp"><i id="aExpbar" style="width:0%"></i></div>
        <div style="display:flex;gap:8px;margin-top:11px;font-size:11px;color:var(--dim);flex-wrap:wrap;">
          <span id="aEq"></span>
        </div>
        <div style="margin-top:7px;font-size:11.5px;" id="aItem"></div>
      </div>
      <div>
        <div class="enemy idle" id="aEnemy">街道を進んでいる…</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
<button id="btnAbort" class="ghost danger" style="margin-left:auto;">冒険を中断</button>
          <button id="btnBackPrep" class="primary hide" style="margin-left:auto;font-size:13px;padding:9px 20px;">準備にもどる</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>冒険ログ</h2>
    <div id="log"></div>
  </div>
</div>

</div>

<!-- ============ modal ============ -->
<!-- チュートリアル（画面を指しながら進む案内） -->
<div id="coach" class="hide">
  <div id="coachBlock"></div>
  <div id="coachHole"></div>
  <div id="coachBubble"></div>
</div>

<div class="modal hide" id="modal"><div class="box" id="modalBox"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script>
(function(){
"use strict";

/* =====================================================================
   バランス設定 — ここの数字をいじれば調整できます
   ===================================================================== */
var BAL = {
  tickSeconds: 3,            // 1ターン＝3秒

  expNeedMul: 1.15           // 大きくするほどレベルが上がりにくくなる
};

function expToNext(lv){ return Math.round(18 * Math.pow(lv, 1.5) * BAL.expNeedMul); }
/* レベルと端数を、通算の経験値に直す／戻す（失敗時の8割計算に使う） */
function totalExp(lv, exp){
  var t = 0;
  for (var i = 1; i < lv; i++) t += expToNext(i);
  return t + exp;
}
function fromTotalExp(total){
  var lv = 1;
  while (total >= expToNext(lv) && lv < 999){ total -= expToNext(lv); lv++; }
  return { lv:lv, exp:total };
}

/* =====================================================================
   純粋ロジック（画面に依存しない＝シミュレーションで検証できる）
   ===================================================================== */
function rnd(a,b){ return a + Math.random()*(b-a); }

function setMultiplier(eq){
  var cnt = {};
  ['w','s','a'].forEach(function(k){
    var g = eq[k];
    if (g && g.s !== 'none') cnt[g.s] = (cnt[g.s]||0) + 1;
  });
  var bestS = null, best = 0;
  for (var s in cnt) if (cnt[s] > best){ best = cnt[s]; bestS = s; }
  if (best >= 3) return { m: (bestS==='cook' ? BAL.cookMul3 : BAL.setMul3), s:bestS, c:3 };
  if (best === 2) return { m: BAL.setMul2, s:bestS, c:2 };
  return { m:1, s:null, c:best };
}
function stats(p){
  var baseAtk = BAL.baseAtk + BAL.atkPerLv * (p.lv - 1);
  var w = p.equip.w ? p.equip.w.v : 0;
  var d = (p.equip.s ? p.equip.s.v : 0) + (p.equip.a ? p.equip.a.v : 0);
  var sm = setMultiplier(p.equip);
  return {
    atk: Math.round((baseAtk + w) * sm.m),
    def: Math.round(d * sm.m),
    maxHp: BAL.baseHp + BAL.hpPerLv * (p.lv - 1),
    set: sm
  };
}
function dmg(atk, def){ return Math.max(1, Math.round(atk * rnd(0.85, 1.15)) - def); }

/* 装備は「定義のコピー」を持つ。同じ種類でも1つずつロックできるようにするため */
function mkGear(def){
  return {id:def.id, n:def.n, ic:def.ic, s:def.s, v:def.v, t:def.t, p:def.p, locked:false};
}

/* アイテム：所持は3つまで、冒険に持っていけるのは1つ（p.carry） */
function addItem(p, id){
  if (!p.items) p.items = [];
  if (p.items.length >= BAL.itemMax) return false;
  p.items.push(id);
  if (!p.carry) p.carry = id;
  return true;
}
function consumeCarry(p){
  var id = p.carry, i = p.items ? p.items.indexOf(id) : -1;
  if (i >= 0) p.items.splice(i, 1);
  p.carry = null;
  return id;
}

function makeRun(stage, startHpRatio){
  var tickSec = stage.tickSec || BAL.tickSeconds;
  var total = Math.max(2, Math.round((stage.sec || stage.min * 60) / tickSec));
  return {
    stageId: stage.id, totalTicks: total, tick: 0, tickSec: tickSec,
    phase:'travel', enemy:null, turn:'p',
    midDone:false, bigDone:false, bigQueued:false,
    killed:0, expGot:0, chests:0, fairyGot:null, gearGot:0,
    loot:[], itemsFound:[], startTotalExp:0, potionsUsed:0, startHpRatio: startHpRatio || 1,
    speedMul:1, result:null, startedAt: Date.now()
  };
}
function spawn(stage){
  var r = Math.random(), tier = 1, mx = stage.mix;
  if (r < mx[0]) tier = 1; else if (r < mx[0]+mx[1]) tier = 2; else tier = 3;
  var m = monByTier(tier);
  var isVar = Math.random() < BAL.variantChance;
  return {
    n: isVar ? '《亜種》' + m.n : m.n, ic: m.ic,
    hp: m.hp, maxHp: m.hp,
    atk: isVar ? Math.round(m.atk * BAL.variantAtkMul) : m.atk,
    def: m.def, exp: m.exp, isVar: isVar, kind:'mob'
  };
}
function bossOf(b, kind){
  return { n:b.n, ic:b.ic, hp:b.hp, maxHp:b.hp, atk:b.atk, def:b.def, exp:b.exp, isVar:false, kind:kind };
}

/* 1ターン進める。発生した出来事を配列で返す */
function step(run, p, st){
  var ev = [], stage = stageById(run.stageId);
  run.tick++;

  /* 中ボス出現 */
  if (!run.midDone && run.phase === 'travel' && run.tick >= Math.floor(run.totalTicks * BAL.bossAt)){
    run.enemy = bossOf(stage.mid, 'mid');
    run.phase = 'battle'; run.turn = 'p';
    ev.push({k:'boss', m:'【中ボス】' + stage.mid.ic + ' ' + stage.mid.n + ' が立ちはだかった！'});
    return ev;
  }

  if (run.phase === 'travel'){
    /* 自然回復 */
    if (p.hp < st.maxHp){
      p._regen = (p._regen || 0) + BAL.regenPerTick;
      while (p._regen >= 1 && p.hp < st.maxHp){ p.hp++; p._regen--; }
    }
    /* 宝箱 */
    var chestP = BAL.chestPer10min / (600 / run.tickSec);
    if (Math.random() < chestP){
      run.chests++;
      /* 装備の上限に達していたら中身は薬草あつかい（上限は画面に出さない） */
      var wantGear = Math.random() >= BAL.chestPotionRate && run.gearGot < BAL.gearPerRun;
      if (!wantGear){
        if (addItem(p, 'potion')){ run.itemsFound.push('potion'); ev.push({k:'get', m:'宝箱から 🌿薬草 をゲットしました'}); }
        else ev.push({k:'get', m:'宝箱を見つけたが、アイテムをこれ以上持てない（' + BAL.itemMax + 'つまで）'});
      } else {
        var slot = ['w','s','a'][Math.floor(Math.random()*3)];
        var g = gearByTier(slot, [0,1]);
        if (g){
          run.loot.push({slot:slot, id:g.id}); run.gearGot++;
          ev.push({k:'get', m:'宝箱から ' + g.ic + g.n + '（' + SLOTN[slot] + ' +' + g.v + '）をゲットしました'});
        }
      }
    }
    /* 遭遇 */
    if (Math.random() < stage.enc){
      run.enemy = spawn(stage); run.phase='battle'; run.turn='p';
      ev.push({k:'enc', m:run.enemy.ic + ' ' + run.enemy.n + ' と出会いました'});
    }
    return ev;
  }

  /* ---- 戦闘 ---- */
  var e = run.enemy;
  if (run.turn === 'p'){
    var d = dmg(st.atk, e.def);
    e.hp -= d;
    if (e.hp <= 0){
      ev.push({k:'kill', m:e.n + 'に ' + d + ' ダメージを与えました　' + e.n + 'を倒しました'});
      run.killed++; run.expGot += e.exp; p.exp += e.exp;
      ev.push({k:'get', m:'経験値 ' + e.exp + ' を手に入れた'});
      /* レベルアップ */
      while (p.exp >= expToNext(p.lv)){
        p.exp -= expToNext(p.lv); p.lv++;
        var ns = stats(p);
        if (BAL.healOnLevelUp) p.hp = ns.maxHp;
        ev.push({k:'lvup', m:'★ レベルが ' + p.lv + ' に上がった！（HP ' + ns.maxHp + ' / こうげき ' + ns.atk + '）'});
      }
      /* ボス報酬 */
      if (e.kind === 'mid' || e.kind === 'big'){
        var slot2 = ['w','s','a'][Math.floor(Math.random()*3)];
        var g2 = run.gearGot < BAL.gearPerRun ? gearByTier(slot2, stage.drop) : null;
        if (g2){
          run.loot.push({slot:slot2, id:g2.id}); run.gearGot++;
          ev.push({k:'get', m:'討伐の宝 ' + g2.ic + g2.n + '（' + SLOTN[slot2] + ' +' + g2.v + '）を手に入れた'});
        }
        if (e.kind === 'mid'){
          run.midDone = true;
          if (Math.random() < stage.big.chance){
            run.bigQueued = true;
            ev.push({k:'boss', m:'…地鳴りがする。何かがこちらへ向かってくる。'});
          }
        } else { run.bigDone = true; }
      }
      run.enemy = null; run.phase = 'travel';
      if (run.bigQueued && !run.bigDone){
        run.bigQueued = false;
        run.enemy = bossOf(stage.big, 'big'); run.phase='battle'; run.turn='p';
        ev.push({k:'boss', m:'【大ボス】' + stage.big.ic + ' ' + stage.big.n + ' が姿を現した！！'});
      }
      return ev;
    }
    ev.push({k:'dmg', m:e.n + 'に ' + d + ' ダメージを与えました（のこりHP ' + e.hp + '）'});
    run.turn = 'e';
    return ev;
  } else {
    var d2 = dmg(e.atk, st.def);
    p.hp -= d2;
    ev.push({k:'hurt', m:e.n + 'から ' + d2 + ' ダメージを受けました（HP ' + Math.max(0,p.hp) + '）'});
    /* 薬草の自動使用（持っていった1つだけ使える） */
    if (p.hp > 0 && p.carry === 'potion' && p.hp < st.maxHp * BAL.potionThreshold){
      consumeCarry(p);
      p.hp = Math.min(st.maxHp, p.hp + BAL.potionHeal); run.potionsUsed++;
      ev.push({k:'get', m:'🌿薬草をつかった。HPが ' + p.hp + ' に回復した'});
    }
    if (p.hp <= 0){ p.hp = 0; run.result = 'defeat'; return ev; }
    run.turn = 'p';
    return ev;
  }
}

/* 妖精（ステージ開始時に1度だけ抽選） */
function rollFairy(p, run){
  if (Math.random() >= BAL.fairyChance) return null;
  var set = [{slot:'w',id:'w_fork'},{slot:'s',id:'s_lid'},{slot:'a',id:'a_apron'}];
  var missing = set.filter(function(x){
    var has = p.inv[x.slot].some(function(it){ return it.id === x.id; });
    var eq = p.equip[x.slot] && p.equip[x.slot].id === x.id;
    var lo = run.loot.some(function(l){ return l.id === x.id; });
    return !has && !eq && !lo;
  });
  var pick = (missing.length ? missing : set)[Math.floor(Math.random() * (missing.length ? missing.length : set.length))];
  run.loot.push({slot:pick.slot, id:pick.id});
  run.gearGot++;            /* 妖精のぶんも1回の上限に数える */
  run.fairyGot = pick.id;
  return gearById(pick.id);
}

window.SIM = {
  run: function(stageId, lv, gearIds, withPotion){
    var p = { lv: lv||1, exp:0, hp:0,
              items: withPotion ? ['potion'] : [], carry: withPotion ? 'potion' : null,
              equip:{w:null,s:null,a:null}, inv:{w:[],s:[],a:[]} };
    (gearIds||[]).forEach(function(id){ var g = gearById(id); if (g) p.equip[g.slot] = g.def; });
    var st = stats(p); p.hp = st.maxHp;
    var stage = stageById(stageId);
    var run = makeRun(stage, 1);
    rollFairy(p, run);
    while (run.tick < run.totalTicks && !run.result){
      st = stats(p);
      step(run, p, st);
    }
    if (!run.result) run.result = 'return';
    return { result:run.result, killed:run.killed, exp:run.expGot, lv:p.lv,
             hp:p.hp, maxHp:stats(p).maxHp, chests:run.chests, loot:run.loot.length,
             midDone:run.midDone, bigDone:run.bigDone, potions:run.potionsUsed };
  },
  stats: stats, BAL: BAL, expToNext: expToNext, STAGES: STAGES, MON: MON, GEAR: GEAR
};

/* 強い順に、その枠の装備を n 個 */
function topGear(slot, n){
  return GEAR[slot].slice().sort(function(a,b){ return b.v - a.v || b.p - a.p; }).slice(0, n);
}

function newPlayer(){
  var id = 'PL-';
  for (var i=0;i<8;i++) id += '0123456789ABCDEF'[Math.floor(Math.random()*16)];
  return {
    version:1, id:id, name:'冒険者', driveFileId:null,
    lv:1, exp:0, hp:BAL.baseHp, items:[], carry:null, gold:0, unlocked:{},
    equip:{w:null,s:null,a:null}, inv:{w:[],s:[],a:[]},
    nextHpRatio:1, totalRuns:0, totalKills:0, totalGold:0, createdAt:Date.now()
  };
}
/* テスト版は最初から、武器・盾・防具それぞれ上位5つと 1000G を持った状態で始める */
var DEV_GOLD = 1000;
function devFillGear(p){
  ['w','s','a'].forEach(function(k){ p.inv[k] = topGear(k, BAL.invMax).map(mkGear); });
  return p;
}
function seedDevGear(p){
  devFillGear(p);
  p.gold = DEV_GOLD;
  return p;
}
function serialize(){
  function g(x){ return x ? x.id : null; }
  function invEnt(x){ return x.locked ? {id:x.id, locked:1} : x.id; }
  return {
    version:1, id:P.id, name:P.name, driveFileId:P.driveFileId,
    lv:P.lv, exp:P.exp, hp:P.hp, items:P.items.slice(), carry:P.carry,
    gold:P.gold, totalGold:P.totalGold, unlocked:P.unlocked,
    equip:{w:g(P.equip.w), s:g(P.equip.s), a:g(P.equip.a)},
    inv:{ w:P.inv.w.map(invEnt), s:P.inv.s.map(invEnt), a:P.inv.a.map(invEnt) },
    nextHpRatio:P.nextHpRatio, totalRuns:P.totalRuns, totalKills:P.totalKills,
    createdAt:P.createdAt, savedAt:Date.now(),
    run: RUN ? RUN : null
  };
}
function deserialize(d){
  var p = newPlayer();
  p.id = d.id || p.id; p.name = d.name || p.name; p.driveFileId = d.driveFileId || null;
  p.lv = d.lv||1; p.exp = d.exp||0;
  p.gold = d.gold||0; p.totalGold = d.totalGold||0;
  p.unlocked = (d.unlocked && typeof d.unlocked === 'object') ? d.unlocked : {};
  /* 旧セーブ（item が1つだけ）からの移行 */
  if (Array.isArray(d.items)){
    p.items = d.items.filter(function(x){ return !!itemById(x); }).slice(0, BAL.itemMax);
    p.carry = (d.carry && p.items.indexOf(d.carry) >= 0) ? d.carry : null;
  } else if (d.item && itemById(d.item)){
    p.items = [d.item]; p.carry = d.item;
  } else { p.items = []; p.carry = null; }
  p.nextHpRatio = (typeof d.nextHpRatio==='number') ? d.nextHpRatio : 1;
  p.totalRuns = d.totalRuns||0; p.totalKills = d.totalKills||0; p.createdAt = d.createdAt||Date.now();
  ['w','s','a'].forEach(function(k){
    p.equip[k] = d.equip && d.equip[k] ? (gearById(d.equip[k])||{}).def || null : null;
    p.inv[k] = ((d.inv && d.inv[k]) || []).map(function(e){
      var id = (e && typeof e === 'object') ? e.id : e;
      var g = gearById(id);
      if (!g) return null;
      var inst = mkGear(g.def);
      if (e && typeof e === 'object' && e.locked) inst.locked = true;
      return inst;
    }).filter(Boolean);
  });
  p.hp = (typeof d.hp==='number') ? d.hp : stats(p).maxHp;
  return { p:p, run:d.run||null };
}
/* ---------------------------------------------------------------
   セーブデータの符号化
   中身をそのまま読めない形にして、合言葉（チェックサム）を添える。
   書き出すたびに salt が変わるので、同じ状態でも毎回ちがう文字列になる。
   ※ これは「うっかり書き換え」を防ぐためのもので、暗号ではありません。
     ページのJSを読めば誰でも復号できます。
   --------------------------------------------------------------- */
function b64enc(str){
  var bytes = new TextEncoder().encode(str), bin = '';
  for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/=+$/, '');
}
function b64bytes(b64){
  var bin = atob(b64.replace(/-/g,'+').replace(/_/g,'/'));
  var out = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function checksum(s){
  var h = 5381;
  for (var i=0;i<s.length;i++) h = (((h * 33) ^ s.charCodeAt(i)) >>> 0);
  return h.toString(36);
}
function xorBytes(bytes, key){
  for (var i=0;i<bytes.length;i++) bytes[i] ^= (key.charCodeAt(i % key.length) & 0xFF);
  return bytes;
}
function packSave(obj){
  var json = JSON.stringify(obj);
  var salt = (Math.floor(Math.random()*0x7FFFFFFF)).toString(36) + (Date.now()%100000).toString(36);
  var key  = 'IdleQuest/' + salt;
  var payload = checksum(json + key) + '|' + json;
  var bytes = new TextEncoder().encode(payload), bin = '';
  xorBytes(bytes, key);
  for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return 'IQ1.' + salt + '.' + btoa(bin).replace(/=+$/, '');
}
function unpackSave(text){
  if (!text) throw new Error('empty');
  text = String(text).trim();
  /* ファイルで渡す場合の包み */
  if (text.charAt(0) === '{'){
    var o = JSON.parse(text);
    if (o && typeof o.data === 'string') return unpackSave(o.data);
    return o;                       /* 旧形式のそのままのJSON */
  }
  var m = /^IQ1\.([0-9a-z]+)\.([A-Za-z0-9+/_=-]+)$/.exec(text.replace(/\s+/g,''));
  if (!m) throw new Error('format');
  var key = 'IdleQuest/' + m[1];
  var payload = new TextDecoder().decode(xorBytes(b64bytes(m[2]), key));
  var k = payload.indexOf('|');
  if (k < 0) throw new Error('format');
  var sum = payload.slice(0, k), json = payload.slice(k + 1);
  if (checksum(json + key) !== sum) throw new Error('tampered');
  return JSON.parse(json);
}
function saveFileText(){
  return JSON.stringify({ game:'idle-quest', version:1, savedAt:new Date().toISOString(),
                          note:'このファイルはゲームの「読み込み」から復元できます。',
                          data: packSave(serialize()) }, null, 2);
}

function save(){
  if (P && P.tut) return;      /* 夢の中のことは記録しない */
  try { localStorage.setItem(SAVEKEY, packSave(serialize())); } catch(e){}
}
function load(){
  try {
    var raw = localStorage.getItem(SAVEKEY);
    if (!raw) return false;
    var r = deserialize(unpackSave(raw));
    P = r.p; RUN = r.run;
    return true;
  } catch(e){ return false; }
}

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]; }); }
function hhmmss(d){
  function z(n){ return (n<10?'0':'') + n; }
  return z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
}
function mmss(sec){
  sec = Math.max(0, Math.round(sec));
  return Math.floor(sec/60) + ':' + (sec%60<10?'0':'') + (sec%60);
}

function serTag(g){
  var s = SERIES[g.s];
  return '<span class="ser ' + s.c + '">' + s.n + '</span>';
}

/* もちものを「強い順」に並べ、装備中・重複の印をつける。
   .i は P.inv[slot] 内のもとの位置（売買で使う） */
function invSorted(slot, inv){
  var list = inv || P.inv[slot];
  var cnt = {};
  list.forEach(function(g){ cnt[g.id] = (cnt[g.id] || 0) + 1; });
  var eq = P.equip[slot];
  /* 同じ物が複数あるときは、実際に身に着けている1つだけを「装備中」にする */
  var eqAt = -1;
  if (eq) for (var k = 0; k < list.length; k++) if (list[k].id === eq.id){ eqAt = k; break; }
  return list.map(function(g, i){
    var isEq = (i === eqAt);
    return { g:g, i:i, eq: isEq, dup: cnt[g.id] > 1 && !isEq };
  }).sort(function(a, b){
    return (b.g.v - a.g.v) || (b.g.p - a.g.p) || a.g.n.localeCompare(b.g.n, 'ja');
  });
}
function badges(r){
  return (r.eq ? '<span class="bdg eq">装備中</span>' : '') +
         (r.dup ? '<span class="bdg dup">重複</span>' : '') +
         (r.g.locked ? '<span class="bdg lock">🔒</span>' : '');
}
function isLocked(s){ return !!(s.lockCost && !(P.unlocked && P.unlocked[s.id])); }
function stageSeconds(s){ return s.sec || s.min * 60; }
function stageTimeLabel(s){ return s.sec ? s.sec + '秒' : s.min + '分'; }

      $('invlist').innerHTML = '<div class="empty-msg">アイテムを持っていません。よろず屋で買えます。</div>';
    } else {
      var carried = false;
      $('invlist').innerHTML = P.items.map(function(id, idx){
        var it = itemById(id);
        var isCarry = !carried && id === P.carry;
        if (isCarry) carried = true;
        return '<div class="item' + (isCarry?' isEq':'') + '">' +

    return '<div class="item">' +
      '<span class="ic">' + ic + '</span>' +

      '<span class="btns"><button data-buy="' + s.id + '"' + (full||!afford ? ' disabled' : '') + '>' +
      (why || 'かう') + '</button></span></div>';
  }).join('');

  /* ステージ */
  $('stages').innerHTML = activeStages().map(function(s){
    var locked = isLocked(s);
    return '<button class="stage' + (selStage===s.id?' on':'') + (locked?' locked':'') + '" data-st="' + s.id + '">' +
      '<div class="top"><span class="ic">' + (locked ? '🔒' : s.ic) + '</span><span><span class="nm">' + s.n + '</span><br>' +
      '<span class="lv">LEVEL ' + s.lv + ' ・ ' + stageTimeLabel(s) + 'で帰還</span></span></div>' +
      '<div class="desc">' + s.desc + '</div>' +
      (locked
        ? '<div class="meta"><span style="color:var(--gold)">🍺 門番に ' + s.lockCost + ' G はらうと通れる</span></div>'
        : '<div class="meta"><span>中ボス ' + s.mid.ic + ' ' + s.mid.n + '</span><span>大ボス ' + Math.round(s.big.chance*100) + '%</span></div>') +
      '</button>';

  $('btnGo').disabled = !selStage;

var logBuf = [];
function pushLog(kind, msg, when){
  var t = hhmmss(when || new Date());
  logBuf.push({t:t, k:kind, m:msg});
  if (logBuf.length > 400) logBuf.shift();
}
function renderLog(){
  var el = $('log');
  var atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.innerHTML = logBuf.map(function(l){
    return '<div class="l"><span class="t">' + l.t + '</span><span class="m ' + l.k + '">' + l.m + '</span></div>';
  }).join('');
  if (atBottom) el.scrollTop = el.scrollHeight;
}

      '<div class="kv" style="margin-top:3px;"><span>こうげき ' + e.atk + ' / ぼうぎょ ' + e.def + '</span><b>' + Math.max(0,e.hp) + ' / ' + e.maxHp + '</b></div>' +
      '</span>';
  } else {
    $('aEnemy').className = 'enemy idle';
    $('aEnemy').textContent = '道を進んでいる…';
  }
}

var modalClosable = false;
function modal(html, onReady, closable){
  $('modalBox').innerHTML = html;
  $('modal').classList.remove('hide');
  modalClosable = !!closable;
  if (onReady) onReady($('modalBox'));
}
function closeModal(){ $('modal').classList.add('hide'); modalClosable = false; }

/* 閉じてよい画面は、背景クリックと Esc でも閉じられるようにする */
$('modal').addEventListener('click', function(e){
  if (modalClosable && e.target === $('modal')) closeModal();
});
window.addEventListener('keydown', function(e){

});

/* =====================================================================
   冒険の進行
   ===================================================================== */
function startRun(){
  var stage = stageById(selStage);
  var st = stats(P);
  var ratio = P.nextHpRatio;
  var begin = function(){
    closeModal();
    P.hp = Math.max(1, Math.round(st.maxHp * ratio));
    P.nextHpRatio = 1;
    P._regen = 0;
    RUN = makeRun(stage, ratio);
    RUN.startTotalExp = totalExp(P.lv, P.exp);
    logBuf = [];
    /* 速度の秘薬は出発のときに飲む */
    if (P.carry === 'haste'){
      consumeCarry(P);
      RUN.speedMul = BAL.hasteMul;
    }
    pushLog('sys', '——— ' + stage.ic + ' ' + stage.n + ' へ出発しました（所要 ' +
      mmss(stageSeconds(stage) / RUN.speedMul) + '）———');
    if (RUN.speedMul > 1) pushLog('lvup', '🌀 速度の秘薬を飲みほした。足もとが軽い。道のりが ' + RUN.speedMul + ' 倍の速さで進む。');
    if (ratio < 1) pushLog('sys', '前回の傷が残っている。HP ' + P.hp + ' / ' + st.maxHp + ' でのスタート。');
    var f = rollFairy(P, RUN);
    if (f) pushLog('fairy', '🧚 妖精に出会った！　「これ、使ってみて」' + f.def.ic + f.def.n + '（' + SLOTN[f.slot] + ' +' + f.def.v + '）をもらった');
    P.totalRuns++;
    $('scPrep').classList.add('hide');
    $('scAdv').classList.remove('hide');
    renderAdv(); renderLog(); save();
    startTimer();
  };
  if (ratio < 1){
    modal(
      '<h3>⚠ 体力が回復しきっていません</h3>' +
      '<p>前回の冒険で力尽きたため、<b>HP ' + Math.round(ratio*100) + '%（' + Math.round(st.maxHp*ratio) + ' / ' + st.maxHp + '）</b>の状態で出発することになります。<br>このまま出発しますか？</p>' +
      '<div class="acts"><button id="mNo" class="ghost">やめる</button><button id="mYes" class="primary">出発する</button></div>',
      function(box){
        box.querySelector('#mNo').onclick = closeModal;
        box.querySelector('#mYes').onclick = begin;
      }
    );
  } else begin();
}

function startTimer(){
  stopTimer();
  timer = setInterval(tickLoop, 100);
}
function stopTimer(){ if (timer){ clearInterval(timer); timer = null; } }

var acc = 0, lastNow = Date.now();
function tickLoop(){
  if (!RUN || RUN.result) return;
  var now = Date.now();
  var dt = (now - lastNow) / 1000;
  lastNow = now;
  if (dt > 60) dt = 60;              // 復帰時の暴走防止
  acc += dt * speed * (RUN.speedMul || 1);
  var budget = 0;
  while (acc >= RUN.tickSec && !RUN.result && RUN.tick < RUN.totalTicks && budget < 400){
    acc -= RUN.tickSec;
    budget++;
    var st = stats(P);
    var ev = step(RUN, P, st);
    var when = new Date(RUN.startedAt + RUN.tick * RUN.tickSec * 1000 / (RUN.speedMul || 1));
    for (var i=0;i<ev.length;i++) pushLog(ev[i].k, ev[i].m, when);
  }
  if (RUN.result === 'defeat'){ finish('defeat'); return; }
  if (RUN.tick >= RUN.totalTicks){ finish('return'); return; }
  renderAdv(); renderLog();
  if (RUN.tick % 10 === 0) save();
}

/* 帰還画面に出す、手に入れたものの一覧 */
function lootRows(rows){
  return '<div class="invlist">' + rows.map(function(x){
    return '<div class="item">' +
      '<span class="ic">' + x.ic + '</span>' +
      '<span class="nm">' + esc(x.n) + (x.ser ? ' ' + x.ser : '') + (x.tag ? '<span class="tagx">' + x.tag + '</span>' : '') + '</span>' +
      '<span class="vl">' + x.sub + '</span>' +
      '</div>';
  }).join('') + '</div>';
}

/* 冒険で手に入れたものを、買い戻しに使える一覧にする */
function lootList(run){
  var out = [];
  run.loot.forEach(function(l){
    var g = gearById(l.id);
    if (g) out.push({ kind:'gear', slot:g.slot, def:g.def, ic:g.def.ic, n:g.def.n,
                      sub:SLOTN[g.slot] + ' +' + g.def.v, price:g.def.p });
  });
  (run.itemsFound || []).forEach(function(id){
    var it = itemById(id);
    if (it) out.push({ kind:'item', id:id, ic:it.ic, n:it.n, sub:it.eff, price:it.p });
  });
  return out;
}

function finish(kind){
  stopTimer();
  var stage = stageById(RUN.stageId);
  var lost = (kind === 'defeat');
  var fee = 0, fullFee = 0, expKept = RUN.expGot;

  if (lost){
    /* 経験値は8割だけ残る（出発時の通算に戻してから足し直す） */
    expKept = Math.floor(RUN.expGot * BAL.failExpRate);
    var r = fromTotalExp((RUN.startTotalExp || 0) + expKept);
    P.lv = r.lv; P.exp = r.exp;

    var st2 = stats(P);
    P.nextHpRatio = BAL.reviveHp;
    P.hp = Math.max(1, Math.round(st2.maxHp * BAL.reviveHp));

    /* 救助費用。足りなければ払えるぶんだけ（借金はしない） */
    fullFee = Math.round(stageSeconds(stage) / 60 * BAL.rescueFeePerMin);
    fee = Math.min(fullFee, P.gold);
    P.gold -= fee;

    /* 道中で拾ったアイテムは、いったん手元から消える（買い戻しで取り返せる） */
    (RUN.itemsFound || []).forEach(function(id){
      var i = P.items.indexOf(id);
      if (i >= 0) P.items.splice(i, 1);
    });
    if (P.carry && P.items.indexOf(P.carry) < 0) P.carry = null;

    pushLog('hurt', '✖ 力つきた…　通りかかった隊商に助け出され、町まで運ばれた。');
    if (fee > 0) pushLog('sys', '救助の費用として ' + fee + ' G を支払った。');
    pushLog('sys', '荷物は道に置いてきてしまった。買い戻すこともできるが、足もとを見られている。');
  } else {
    pushLog('sys', '——— ' + stage.n + ' から無事に帰還しました ———');
    P.nextHpRatio = 1;
  }
  P.totalKills += RUN.killed;
  renderLog(); renderAdv(); renderPrep();   /* 結果画面の裏の表示も最新にしておく */

  /* 成功したときだけ、戦利品はそのままもちものへ */
  var gained = [], overflow = [], autoSold = [], autoGold = 0;
  if (!lost){
    gained = RUN.loot.map(function(l){ return gearById(l.id); }).filter(Boolean);
    gained.forEach(function(g){
      if (P.inv[g.slot].length < BAL.invMax){ P.inv[g.slot].push(mkGear(g.def)); return; }
      var dup = P.inv[g.slot].some(function(x){ return x.id === g.def.id; }) ||
                (P.equip[g.slot] && P.equip[g.slot].id === g.def.id);
      if (dup){ autoSold.push(g); autoGold += g.def.p; } else overflow.push(g);
    });
    if (autoGold){ P.gold += autoGold; P.totalGold += autoGold; }
  }
  var leftBehind = lost ? lootList(RUN) : [];

  /* 手に入れたものを、わかりやすく並べる */
  var lootBlock;
  if (lost){
    lootBlock = leftBehind.length
      ? '<div class="loot none"><h5>道に残してきたもの</h5>' +
        lootRows(leftBehind.map(function(x){
          return { ic:x.ic, n:x.n, sub:x.sub, ser:(x.kind==='gear' ? serTag(x.def) : '') };
        })) +
        '<p style="font-size:11px;color:var(--dim);margin:9px 0 0;">このあと、お金を払えば取り返せます。</p></div>'
      : '<div class="loot none"><h5>手に入れたもの</h5><div class="empty-msg">何も持ち帰れませんでした。</div></div>';
  } else {
    var rows = [];
    gained.forEach(function(g){
      var sold = autoSold.indexOf(g) >= 0;
      rows.push({ ic:g.def.ic, n:g.def.n, ser:serTag(g.def),
                  sub:SLOTN[g.slot] + ' +' + g.def.v, tag: sold ? '売却 +' + g.def.p + 'G' : '' });
    });
    (RUN.itemsFound || []).forEach(function(id){
      var it = itemById(id);
      if (it) rows.push({ ic:it.ic, n:it.n, sub:it.eff, ser:'' });
    });
    lootBlock = rows.length
      ? '<div class="loot"><h5>手に入れたもの　' + rows.length + '点</h5>' + lootRows(rows) + '</div>'
      : '<div class="loot none"><h5>手に入れたもの</h5><div class="empty-msg">今回は何も見つかりませんでした。</div></div>';
  }

  var summary =
    '<h3>' + (lost ? '✖ 強制帰還' : '🏳 帰還しました') + '</h3>' +
    '<p>' + stage.ic + ' ' + stage.n + (lost
      ? '　体力が尽きたため、途中で運び出されました。次の出発は <b>HP ' + Math.round(BAL.reviveHp*100) + '%</b> からになります。'
      : '　予定どおり ' + stageTimeLabel(stage) + 'の行程を踏破しました。') + '</p>' +
    '<div class="res">' +
      '<div><span>たおした数</span><b>' + RUN.killed + '</b></div>' +
      '<div><span>' + (lost ? 'もちかえった経験値' : 'かくとく経験値') + '</span><b>' + expKept +
        (lost ? '<span style="font-size:11px;color:var(--dim)"> / ' + RUN.expGot + '</span>' : '') + '</b></div>' +
      '<div><span>いまのレベル</span><b>' + P.lv + '</b></div>' +
      '<div><span>宝箱</span><b>' + RUN.chests + '</b></div>' +
    '</div>' +
    (lost ? '<p style="font-size:12px;color:' + (fee > 0 ? 'var(--red)' : 'var(--dim)') + ';">救助費用 −' + fee + ' G' +
      (fee < fullFee ? '　<span style="color:var(--dim)">（本来は ' + fullFee + ' G。持ち合わせがなく、残りは見逃してもらった）</span>' : '') +
      '</p>' : '') +
    '<p style="font-size:12px;">しょじきん: <b class="gold">' + P.gold + ' G</b></p>' +
    (RUN.midDone ? '<p style="color:var(--green);font-size:12px;">✔ ' + stage.mid.n + ' を撃破</p>' : '<p style="color:var(--dim);font-size:12px;">中ボスには届きませんでした</p>') +
    (RUN.bigDone ? '<p style="color:var(--purple);font-size:12px;">✔✔ 大ボス ' + stage.big.n + ' を撃破！</p>' : '') +
    lootBlock +
    (autoSold.length ? '<p style="font-size:11.5px;color:var(--dim);">※ 同じ物を持っていて枠が満杯だったぶんは、道中で売りました → <span class="gold">+' + autoGold + ' G</span></p>' : '') +
    '<div class="acts"><button id="mLog" class="ghost">ログを見る</button>' +
    '<button id="mOk" class="primary">' + (leftBehind.length ? 'つぎへ' : 'もどる') + '</button></div>';

  var proceed = function(){
    var wasTut = !!stage.tut;
    RUN = null; acc = 0;
    $('btnBackPrep').classList.add('hide');
    $('btnAbort').classList.remove('hide');
    $('scAdv').classList.add('hide');
    $('scPrep').classList.remove('hide');
    renderPrep(); save();
    if (wasTut){ tutWake(); return; }
    if (leftBehind.length) askBuyback(leftBehind);
    else if (overflow.length) askDiscard(overflow, 0);
    else closeModal();
  };
  pendingAfterRun = proceed;

  modal(summary, function(box){
    box.querySelector('#mOk').onclick = proceed;
    box.querySelector('#mLog').onclick = function(){
      /* 冒険画面に残ってログを読めるようにする */
      closeModal();
      $('btnAbort').classList.add('hide');
      $('btnBackPrep').classList.remove('hide');
      var el = $('log');
      el.scrollTop = el.scrollHeight;
      el.scrollIntoView({behavior:'smooth', block:'center'});
    };
  });
}
var pendingAfterRun = null;

/* =====================================================================

  { t:'よろず屋', sel:'#panelShop',

var tutStep = 0, tutTimer = null;

function tutStart(){
  P.tut = true;
  P.gold = 0;
  P.items = []; P.carry = null;
  P.inv = { w:[ mkGear(gearById('w_stick').def) ], s:[], a:[] };
  P.equip = { w:null, s:null, a:null };
  P.unlocked = {};
  selStage = null;
  tutStep = 0;
  $('scAdv').classList.add('hide');
  $('scPrep').classList.remove('hide');
  renderPrep();
  coachShow();
}
function coachStop(){
  if (tutTimer){ clearInterval(tutTimer); tutTimer = null; }
}
function coachHide(){
  coachStop();
  $('coach').classList.add('hide');
}
function coachNext(){ tutStep++; coachShow(); }
function coachBack(){ if (tutStep > 0){ tutStep--; coachShow(); } }

function coachShow(){
  var s = TUT_STEPS[tutStep];
  coachStop();
  if (!s){ coachHide(); return; }
  $('coach').classList.remove('hide');
  var el = s.sel ? document.querySelector(s.sel) : null;
  if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
  setTimeout(function(){ coachPaint(); }, el ? 320 : 0);

  /* 操作を待つ段階は、画面を触れるようにして、終わったら自動でつぎへ */
  var waiting = !!(s.act && !s.act());
  $('coach').classList.toggle('pass', waiting);
  if (waiting){
    tutTimer = setInterval(function(){
      if (!P || !P.tut){ coachHide(); return; }
      /* 装備を選ぶ画面などが開いている間は、案内を完全に引っこめる */
      var mo = !$('modal').classList.contains('hide');
      $('coach').classList.toggle('away', mo);
      if (s.act()){ coachStop(); $('coach').classList.remove('away'); coachNext(); }
    }, 150);
  } else {
    $('coach').classList.remove('away');
  }
}

function coachPaint(){
  var s = TUT_STEPS[tutStep];
  if (!s || $('coach').classList.contains('hide')) return;
  var hole = $('coachHole'), bub = $('coachBubble');
  var el = s.sel ? document.querySelector(s.sel) : null;
  var r = el ? el.getBoundingClientRect() : null;

  if (r){
    var pad = 8;
    hole.style.left = (r.left - pad) + 'px';
    hole.style.top = (r.top - pad) + 'px';
    hole.style.width = (r.width + pad * 2) + 'px';
    hole.style.height = (r.height + pad * 2) + 'px';
    hole.style.borderWidth = '2px';
  } else {
    /* 穴なし＝画面全体を暗くするだけ */
    hole.style.left = '50%'; hole.style.top = '-40px';
    hole.style.width = '0px'; hole.style.height = '0px';
    hole.style.borderWidth = '0px';
  }

  var done = !!(s.act && s.act());
  var waiting = !!(s.act && !done);
  bub.innerHTML =
    '<h4>' + s.t + '</h4>' +
    '<p>' + s.b + '</p>' +
    (waiting ? '<div class="do">👉 ' + s.do + '</div>' : '') +
    '<div class="foot">' +
      '<button class="coach-skip" id="coachSkip">チュートリアルをスキップ</button>' +
      (waiting ? '<button class="coach-skip" id="coachPass" style="margin-left:10px;">この手順をとばす</button>' : '') +
      '<span class="sp"></span>' +
      '<span class="count">' + (tutStep + 1) + ' / ' + TUT_STEPS.length + '</span>' +
      (tutStep > 0 ? '<button id="coachBack" class="ghost" style="font-size:11.5px;padding:5px 11px;">もどる</button>' : '') +
      (waiting ? '' : '<button id="coachNext" class="primary" style="font-size:12.5px;padding:7px 16px;">つぎへ</button>') +
    '</div>';
  bub.querySelector('#coachSkip').onclick = tutSkip;
  var ps = bub.querySelector('#coachPass'); if (ps) ps.onclick = function(){ coachStop(); coachNext(); };
  var bk = bub.querySelector('#coachBack'); if (bk) bk.onclick = coachBack;
  var nx = bub.querySelector('#coachNext'); if (nx) nx.onclick = coachNext;

  /* 吹き出しの位置 */
  bub.style.visibility = 'hidden';
  bub.style.left = '0px'; bub.style.top = '0px';
  var bw = bub.offsetWidth, bh = bub.offsetHeight;
  var left, top;
  if (r){
    top = r.bottom + 14;
    if (top + bh > window.innerHeight - 12) top = r.top - bh - 14;
    if (top < 12) top = Math.max(12, (window.innerHeight - bh) / 2);
    left = r.left + (r.width - bw) / 2;
  } else {
    left = (window.innerWidth - bw) / 2;
    top = (window.innerHeight - bh) / 2;
  }
  left = Math.min(Math.max(12, left), window.innerWidth - bw - 12);
  bub.style.left = left + 'px';
  bub.style.top = top + 'px';
  bub.style.visibility = 'visible';
}
window.addEventListener('resize', function(){ coachPaint(); });
window.addEventListener('scroll', function(){ coachPaint(); }, true);

function tutSkip(){
  coachHide();
  modal(
    '<h3>目を覚ましますか？</h3>' +
    '<p>チュートリアルをとばして、本編をはじめます。</p>' +
    '<div class="acts"><button id="mNo" class="ghost">つづける</button>' +
    '<button id="mYes" class="primary">目を覚ます</button></div>',

      box.querySelector('#mNo').onclick = function(){ closeModal(); coachShow(); };
      box.querySelector('#mYes').onclick = tutWake;

/* 失敗したとき、置いてきた荷物を売値の3倍で買い戻す */
function askBuyback(list){
  var chosen = {};
  function cost(){
    var t = 0;
    list.forEach(function(x, i){ if (chosen[i]) t += x.price * BAL.buybackMul; });
    return t;
  }
  function draw(){
    var total = cost(), over = total > P.gold;
    modal(
      '<h3>🪢 荷物の買い戻し</h3>' +
      '<p>置いてきた荷物は、拾った者が町で売りに出しています。<b>売値の' + BAL.buybackMul + '倍</b>を払えば取り返せます。</p>' +
      '<div class="invlist">' + list.map(function(x, i){
        var pr = x.price * BAL.buybackMul;
        return '<div class="item' + (chosen[i] ? ' isEq' : '') + '">' +
          '<span class="ic">' + x.ic + '</span>' +
          '<span class="nm">' + esc(x.n) + '<span class="shopdesc">' + x.sub + '</span></span>' +
          '<span class="price">' + pr + ' G</span>' +
          '<span class="btns"><button data-i="' + i + '">' + (chosen[i] ? '✓ 買う' : '買う') + '</button></span>' +
          '</div>';
      }).join('') + '</div>' +
      '<p style="font-size:12px;margin-top:12px;">合計 <b class="gold">' + total + ' G</b>' +
      '　/　しょじきん <b class="gold">' + P.gold + ' G</b>' +
      (over ? '　<span style="color:var(--red)">足りません</span>' : '') + '</p>' +
      '<div class="acts"><button id="mSkip" class="ghost">あきらめる</button>' +
      '<button id="mBuy" class="primary"' + (over || total === 0 ? ' disabled' : '') + '>買い戻す</button></div>',
      function(box){
        box.querySelectorAll('.invlist button[data-i]').forEach(function(b){
          b.onclick = function(){ var i = +b.dataset.i; chosen[i] = !chosen[i]; draw(); };
        });
        box.querySelector('#mSkip').onclick = function(){ closeModal(); renderPrep(); save(); };
        var buy = box.querySelector('#mBuy');
        if (!buy.disabled) buy.onclick = function(){
          var total2 = cost();
          if (total2 > P.gold) return;
          P.gold -= total2;
          var over2 = [];
          list.forEach(function(x, i){
            if (!chosen[i]) return;
            if (x.kind === 'item'){ addItem(P, x.id); return; }
            if (P.inv[x.slot].length < BAL.invMax) P.inv[x.slot].push(mkGear(x.def));
            else over2.push({slot:x.slot, def:x.def});
          });
          renderPrep(); save();
          if (over2.length) askDiscard(over2, 0); else closeModal();
        };
      }
    );
  }
  draw();
}

/* そうびスロットから選ぶ */
function openPicker(slot){
  if (slot === 'i'){
    if (!P.items.length){
      invTab = 'i';
      Array.prototype.forEach.call($('invtabs').children, function(x){ x.classList.toggle('on', x.dataset.k === 'i'); });
      renderPrep();
      $('shoplist').scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    var carried = false;
    modal(
      '<h3>🧪 持っていくアイテムをえらぶ</h3>' +
      '<p>持てるのは ' + BAL.itemMax + ' つまで。そのうち<b>冒険に持っていけるのは1つだけ</b>です。</p>' +
      '<div class="invlist">' + P.items.map(function(id){
        var it = itemById(id), isC = !carried && id === P.carry;
        if (isC) carried = true;
        return '<div class="item' + (isC?' isEq':'') + '"><span class="ic">' + it.ic + '</span>' +
          '<span class="nm">' + it.n + '<span class="shopdesc">' + it.desc + '</span></span>' +
          '<span class="vl">' + it.eff + '</span>' +
          '<span class="btns"><button data-id="' + id + '"' + (isC?' disabled':'') + '>' +
          (isC ? '持っていく' : 'これにする') + '</button></span></div>';
      }).join('') + '</div>' +
      '<div class="acts">' + (P.carry ? '<button id="mOff" class="ghost">持っていかない</button>' : '') +
      '<button id="mClose" class="primary">とじる</button></div>',
      function(box){
        box.querySelectorAll('.invlist button[data-id]').forEach(function(b){
          if (b.disabled) return;
          b.onclick = function(){ P.carry = b.dataset.id; closeModal(); renderPrep(); save(); };
        });
        var off = box.querySelector('#mOff');
        if (off) off.onclick = function(){ P.carry = null; closeModal(); renderPrep(); save(); };
        box.querySelector('#mClose').onclick = closeModal;
      },
      true
    );
    return;
  }
  var rows = invSorted(slot), eq = P.equip[slot];
  modal(
    '<h3>' + SLOTIC[slot] + ' ' + SLOTN[slot] + ' をえらぶ</h3>' +
    '<p>強い順にならんでいます。' + (eq ? '今は <b>' + eq.ic + esc(eq.n) + '（+' + eq.v + '）</b> を装備中です。' : '今は何も装備していません。') + '</p>' +
    (rows.length
      ? '<div class="invlist">' + rows.map(function(r){
          return '<div class="item' + (r.eq?' isEq':'') + '">' +
            '<span class="ic">' + r.g.ic + '</span>' +
            '<span class="nm">' + esc(r.g.n) + ' ' + serTag(r.g) + badges(r) + '</span>' +
            '<span class="vl">+' + r.g.v + '</span>' +
            '<span class="btns"><button data-i="' + r.i + '"' + (r.eq ? ' disabled' : '') + '>' +
            (r.eq ? '装備中' : 'これにする') + '</button></span></div>';
        }).join('') + '</div>'
      : '<div class="empty-msg">まだ持っていません。ボスや宝箱から手に入ります。</div>') +
    '<div class="acts">' +
      (eq ? '<button id="mOff" class="ghost">はずす</button>' : '') +
      '<button id="mClose" class="primary">とじる</button></div>',
    function(box){
      box.querySelectorAll('.invlist button[data-i]').forEach(function(b){
        if (b.disabled) return;
        b.onclick = function(){
          P.equip[slot] = P.inv[slot][+b.dataset.i];
          closeModal(); renderPrep(); save();
        };
      });
      var off = box.querySelector('#mOff');
      if (off) off.onclick = function(){ P.equip[slot] = null; closeModal(); renderPrep(); save(); };
      box.querySelector('#mClose').onclick = closeModal;
    },
    true
  );
}

/* もちものがあふれた時 — 捨てずに売る */
function sellGear(def){ P.gold += def.p; P.totalGold += def.p; }

/* もちものから1つ取り除く。
   同じ装備を複数持っている場合、1つ売っても手元に残っていれば装備は外さない。
   最後の1つを手放したときだけ装備が外れる。 */
function removeFromInv(slot, index, sell){
  var list = P.inv[slot];
  if (index < 0 || index >= list.length) return null;
  if (list[index].locked) return null;          /* ロック中は売れない */
  var removed = list.splice(index, 1)[0];
  if (sell) sellGear(removed);
  if (P.equip[slot] && P.equip[slot].id === removed.id){
    var stillHave = list.some(function(x){ return x.id === removed.id; });
    if (!stillHave) P.equip[slot] = null;
  }
  return removed;
}

function askDiscard(list, i){
  if (i >= list.length){ closeModal(); renderPrep(); save(); return; }
  var g = list[i], slot = g.slot, cur = P.inv[slot];
  modal(
    '<h3>もちものがいっぱいです</h3>' +
    '<p>' + SLOTIC[slot] + ' ' + SLOTN[slot] + ' は ' + BAL.invMax + ' 個までしか持てません。<br>' +
    '新しく手に入れた <b>' + g.def.ic + esc(g.def.n) + '（+' + g.def.v + '）</b> を持ち帰るには、どれかを売る必要があります。<br>' +
    '<span style="color:var(--dim);font-size:12px;">強い順にならんでいます。売ったぶんは、しょじきん（現在 <span class="gold">' + P.gold + ' G</span>）になります。</span></p>' +
    '<div class="invlist">' + invSorted(slot, cur).map(function(r){
      return '<div class="item' + (r.eq?' isEq':'') + (r.g.locked?' isLocked':'') + '"><span class="ic">' + r.g.ic + '</span>' +
             '<span class="nm">' + esc(r.g.n) + ' ' + serTag(r.g) + badges(r) + '</span>' +
             '<span class="vl">+' + r.g.v + '</span><span class="btns"><button data-j="' + r.i + '"' +
             (r.g.locked ? ' disabled' : (r.eq ? ' class="danger"' : '')) + '>' +
             (r.g.locked ? 'ロック中' : (r.eq ? '装備中だが売る' : 'これを売る') + ' <span class="price">+' + r.g.p + 'G</span>') +
             '</button></span></div>';
    }).join('') + '</div>' +
    '<div class="acts"><button id="mDrop" class="ghost">新しい方を売る（+' + g.def.p + 'G）</button></div>',
    function(box){
      box.querySelectorAll('button[data-j]').forEach(function(b){
        if (b.disabled) return;
        b.onclick = function(){
          removeFromInv(slot, +b.dataset.j, true);
          P.inv[slot].push(mkGear(g.def));
          askDiscard(list, i+1);
        };
      });
      box.querySelector('#mDrop').onclick = function(){ sellGear(g.def); askDiscard(list, i+1); };
    }
  );
}

/* 門番との交渉 */
function openGate(s){
  var afford = P.gold >= s.lockCost;
  modal(
    '<h3>' + s.gate.ic + ' ' + s.gate.who + '</h3>' +
    s.gate.lines.map(function(l){ return '<p style="margin-bottom:9px;">「' + l + '」</p>'; }).join('') +
    '<p style="font-size:12px;color:var(--dim);">しょじきん <span class="gold">' + P.gold + ' G</span>' +
    (afford ? '' : '　— あと <span class="gold">' + (s.lockCost - P.gold) + ' G</span> 足りません') + '</p>' +
    '<div class="acts"><button id="mNo" class="ghost">引き返す</button>' +
    '<button id="mYes" class="primary"' + (afford ? '' : ' disabled') + '>' + s.lockCost + ' G をわたす</button></div>',
    function(box){
      box.querySelector('#mNo').onclick = closeModal;
      var yes = box.querySelector('#mYes');
      if (!yes.disabled) yes.onclick = function(){
        if (P.gold < s.lockCost) return;
        P.gold -= s.lockCost;
        P.unlocked[s.id] = true;
        selStage = s.id;
        renderPrep(); save();
        modal('<h3>' + s.gate.ic + ' ' + s.gate.who + '</h3>' +
          '<p>「' + s.gate.paid + '」</p>' +
          '<p style="font-size:12px;color:var(--dim);">' + s.ic + ' <b>' + s.n + '</b> へ行けるようになりました。一度払えば、次からはそのまま通れます。</p>' +
          '<div class="acts"><button id="mOk" class="primary">OK</button></div>',
          function(b2){ b2.querySelector('#mOk').onclick = closeModal; }, true);
      };
    },
    true
  );
}

  renderPrep();

$('invlist').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b || b.disabled) return;
  /* アイテムタブ */
  if (b.dataset.iact){
    if (b.dataset.iact === 'carry') P.carry = b.dataset.id;
    else if (b.dataset.iact === 'uncarry') P.carry = null;
    else if (b.dataset.iact === 'drop'){
      var idx = +b.dataset.idx, dropped = P.items.splice(idx, 1)[0];
      if (P.carry === dropped && P.items.indexOf(dropped) < 0) P.carry = null;
    }
    renderPrep(); save();
    return;
  }
  /* 装備タブ */
  var i = +b.dataset.i, g = P.inv[invTab][i];
  if (!g) return;
  if (b.dataset.act === 'lock'){
    g.locked = !g.locked;
  } else if (b.dataset.act === 'eq'){
    P.equip[invTab] = (P.equip[invTab] && P.equip[invTab].id === g.id) ? null : g;
  } else {
    removeFromInv(invTab, i, true);
  }
  renderPrep(); save();
});
$('shoplist').addEventListener('click', function(e){
  var b = e.target.closest('button[data-buy]'); if (!b || b.disabled) return;
  var s = SHOP.filter(function(x){ return x.id === b.dataset.buy; })[0];
  if (!s || P.gold < s.price) return;
  if (s.kind === 'item'){
    if (!addItem(P, s.id)) return;
  } else {
    var gg = gearById(s.id);
    if (!gg || P.inv[gg.slot].length >= BAL.invMax) return;
    P.inv[gg.slot].push(mkGear(gg.def));
  }
  P.gold -= s.price;
  renderPrep(); save();
});

/* ファイル保存の経路。Web公開版では claude.use("downloads")、
   HTMLを直接開いた場合は通常のダウンロードを使う */
var dlPromise = null;
function getDownloads(){
  if (dlPromise) return dlPromise;
  if (!(window.claude && typeof window.claude.use === 'function')){
    dlPromise = Promise.resolve(null);
  } else {
    try { dlPromise = window.claude.use('downloads').then(function(d){ return d; }, function(){ return null; }); }
    catch(e){ dlPromise = Promise.resolve(null); }
  }
  return dlPromise;
}
try { getDownloads(); } catch(e){}

function saveToFile(msgEl){
  var json = saveFileText();
  var name = 'idlequest_' + P.id + '.json';
  msgEl.textContent = '保存の準備をしています…';
  getDownloads().then(function(dl){
    if (dl && dl.save){
      dl.save({filename:name, data:json}).then(function(){
        msgEl.textContent = '保存しました。';
      }, function(err){
        var c = err && err.code;
        msgEl.textContent = (c === 'declined') ? '保存をとりやめました。'
          : (c === 'rate_limited') ? '少し待ってからもう一度おしてください。'
          : 'この環境ではファイル保存ができません。「コピー」をお使いください。';
      });
      return;
    }
    try{
      var blob = new Blob([json], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      msgEl.textContent = '保存先にGoogleドライブのフォルダを選べます。ダウンロードが始まらない環境では「コピー」をお使いください。';
    }catch(e){ msgEl.textContent = 'この環境ではファイル保存ができません。「コピー」をお使いください。'; }
  });
}

function applyImport(text){
  try{
    var d = unpackSave(text);
    if (!d || typeof d !== 'object' || !d.id) throw new Error('bad');
    var r = deserialize(d);
    P = r.p; RUN = null; stopTimer();
    $('scAdv').classList.add('hide'); $('scPrep').classList.remove('hide');
    renderPrep(); save();
    modal('<h3>読み込みました</h3><p><b>' + esc(P.name) + '</b>（' + P.id + '）　レベル ' + P.lv +
          '　しょじきん <span class="gold">' + P.gold + ' G</span></p>' +
          '<div class="acts"><button id="mOk" class="primary">OK</button></div>',
      function(box){ box.querySelector('#mOk').onclick = closeModal; });
  }catch(err){
    var why = (err && err.message === 'tampered')
      ? 'データの中身と合言葉が合いません。書き換えられているか、コピーのときに一部が欠けた可能性があります。'
      : 'セーブデータの形式が違うようです。書き出したときの文字が、途中で切れていないか確かめてください。';
    modal('<h3>読み込めませんでした</h3><p>' + why + '</p>' +
          '<div class="acts"><button id="mOk" class="primary">OK</button></div>',
      function(box){ box.querySelector('#mOk').onclick = closeModal; }, true);
  }
}

      box.querySelector('#mYes').onclick = function(){
        stopTimer(); P = newPlayer(); RUN = null; selStage = null; logBuf = [];
        try{ localStorage.removeItem(SAVEKEY); }catch(e){}
        closeModal();
        tutStart();
      };
    }, true);
});
window.addEventListener('beforeunload', save);

/* =====================================================================
   起動
   ===================================================================== */
if (!load()) P = DEV ? seedDevGear(newPlayer()) : newPlayer();
if (!P) P = newPlayer();

if (RUN && !RUN.result && RUN.tick < RUN.totalTicks){
  /* 放置中に閉じていた分を早送りする */
  var away = Math.floor((Date.now() - (RUN.startedAt || Date.now())) / 1000 * (RUN.speedMul || 1) / (RUN.tickSec || BAL.tickSeconds)) - RUN.tick;
  selStage = RUN.stageId;
  logBuf = [];
  pushLog('sys', '——— 冒険のつづきから再開します ———');
  if (away > 0){
    var n = Math.min(away, RUN.totalTicks - RUN.tick);
    for (var i=0;i<n && !RUN.result;i++){
      var ev = step(RUN, P, stats(P));
      var w = new Date(RUN.startedAt + RUN.tick * (RUN.tickSec || BAL.tickSeconds) * 1000 / (RUN.speedMul || 1));
      for (var j=0;j<ev.length;j++) pushLog(ev[j].k, ev[j].m, w);
    }
    pushLog('sys', '（離れていた ' + mmss(n*(RUN.tickSec || BAL.tickSeconds)) + ' の出来事を反映しました）');
  }
  $('scPrep').classList.add('hide');
  $('scAdv').classList.remove('hide');
  renderAdv(); renderLog();
  lastNow = Date.now();
  if (RUN.result === 'defeat') finish('defeat');
  else if (RUN.tick >= RUN.totalTicks) finish('return');
  else startTimer();
} else {
  RUN = null;
}
renderPrep();
save();   /* 初回起動でもIDと初期状態を確定させる */

})();
</script>
</body>
</html>
